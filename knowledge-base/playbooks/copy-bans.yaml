patterns:              # regexes (openers that read as surveillance or templates)
  - "\\b(i )?saw (you|your|that)\\b"
  - "\\b(i )?noticed (you|your|that)\\b"
  - "\\blooks like\\b"
  - "\\bcongrats?\\b"
  - "\\bcongratulations\\b"
  - "\\bnot only\\b.*\\bbut also\\b"     # AI rhythm
  - "\\bit's not (just )?about\\b"        # AI rhythm ("it's not about X, it's about Y")

subject:               # extra rules for subject lines
  max_words: 8
  lowercase: true      # unless the original subject is not lowercase
  no_characters: ["!", "[", "]"]  # no emojis, ! or brackets; "?" and ":" are allowed
