  - "hope you're doing well"
  - "book a call"
  - "schedule 15 minutes"
  - "let me know when you're free"
  - "act now"
  - "limited time"
  - "no obligation"
  - "click here"
  - "urgent"
  - "a seat like that"
  - "in the ai era"
  - "in the age of ai"
  - "the setup is simple"
  - "fresh capital"
  - "newly funded"
  - "next round"
  - "quick win"
  - "no big deal"
  - "small spend"
  - "minimal cost"
  - "in today's fast-paced"
  - "it's no secret"
  - "let me tell you"
  - "hot take"
  - "excited to announce"
  - "thrilled to"
  - "proud to say"
  - "shortest email"
  # AI / template tells
  - "i hope this email finds you"
  - "i hope this finds you"
  - "hope you're well"
  - "i wanted to reach out"
  - "reaching out because"
  - "touch base"
  - "touching base"
  - "just wanted to"
  - "feel free to"
  - "don't hesitate"
  - "looking forward to hearing"
  - "at the end of the day"
  - "move the needle"
  - "low-hanging fruit"
  - "win-win"
  - "pain points"
  - "value-add"
  - "ever-evolving"
