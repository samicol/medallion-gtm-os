# Copy ban list: the global list /campaign-copy (and any copy checker you build) reads.
# Company-specific bans (words, angles, names that must never appear) go in
# context/messaging/facts.md, not here. Edit freely: add, remove, move between sections.
#
# Rule: a ban is enforced on NEW text. If text you were given to edit already contains
# a banned word, flag it; don't silently rewrite the user's own words (render mode is diff-only).
#
# Matching: case-insensitive. `words` match whole words (including listed inflections);
# `phrases` match as substrings; `patterns` are regexes.

characters:            # never in generated copy
  - "\u2014"      # em dash: never, anywhere
  - "\u2013"      # en dash
  - "\u2026"      # ellipsis character
  - "!"                # exclamation marks read as marketing / AI (subjects AND body)

words:
  # core bans (iron laws + campaign-copy)
  - curious            # reads as AI-written and as a spam trigger
  - curiosity
  - free               # campaign-copy: no "free"
  - cheap
  - leverage
  - leveraging
  - synergy
  - synergies
  - optimize
  - optimizing
  - ideate
  - unpack
  - deep-dive
  - guaranteed
  - guarantee
  # AI tells
  - delve
  - delving
  - utilize
  - utilizing
  - streamline
  - streamlined
  - streamlining
  - seamless
  - seamlessly
  - robust
  - elevate
  - elevating
  - unlock
  - unlocking
  - empower
  - empowering
  - harness
  - holistic
  - cutting-edge
